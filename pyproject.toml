[project]
name = "membench"
version = "0.1.0"
description = "A two-track benchmark for agent memory systems"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
membench = "membench.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "syntopica-codeality-py>=0.2.2", "deptry>=0.20,<1", "mypy>=1.11,<2", "pip-audit>=2.7,<3", "ruff>=0.15,<1"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["A", "ARG", "B", "C4", "D", "DTZ", "E", "ERA", "F", "I", "N", "PL", "PTH", "RET", "RUF", "SIM", "UP", "W"]
ignore = ["D203", "D213", "E501", "D107"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101", "ARG", "PLR2004"]
# The manifest's seven fields are the reproduction inputs the design record
# requires; a wrapper type for one call site would hide them rather than
# simplify anything. The parameters are keyword-only, so every call site
# already names them and PLR0917 (too many positional arguments) does not
# fire. Drop this ignore when the gateway plan adds its first field: group
# the pinned inputs into a frozen ReproductionInputs dataclass instead.
"membench/build_manifest.py" = ["PLR0913"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
